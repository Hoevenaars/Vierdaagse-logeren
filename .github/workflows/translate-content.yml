name: Vertaalconcepten bijwerken (DeepL)

# Draait zodra iemand (via het CMS of direct in Git) NL-content wijzigt.
# Zet alleen concepten klaar met status "concept" — publiceert nooit
# automatisch. Zie scripts/translate-content.mjs voor de precieze regels.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/data/gebieden/**.json"
      - "src/data/site-strings.json"
      - "scripts/translate-content.mjs"

# Voorkomt dat de commit die dit workflow zelf maakt, de workflow opnieuw triggert.
concurrency:
  group: translate-content
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies installeren
        run: npm ci

      - name: Vertaalconcepten genereren
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/translate-content.mjs
        # DeepL Free rate-limits bij grote batches; script retry't 429's met backoff.
        timeout-minutes: 30

      - name: Wijzigingen terugzetten (indien aanwezig)
        run: |
          git config user.name "vierdaagse-logeren-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/data/gebieden src/data/site-strings.json
            git commit -m "chore: vertaalconcepten bijwerken (DeepL) [skip ci]"
            git push
          else
            echo "Geen vertaalconcepten nodig — niets te committen."
          fi