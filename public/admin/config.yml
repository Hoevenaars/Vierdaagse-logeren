backend:
  name: github
  repo: Hoevenaars/Vierdaagse-logeren
  branch: main
  base_url: https://www.vierdaagselogeren.nl
  auth_endpoint: api/auth

# Media-uploads (bijv. voor toekomstige afbeeldingen bij aanmeldingen) belanden hier
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "gebieden"
    label: "Gemeentepagina's"
    description: "Eén item per gemeente = één pagina op /gebied/[slug], automatisch in alle 3 talen. Nieuwe gemeente toevoegen = hier een nieuw item aanmaken, geen code nodig."
    folder: "src/data/gebieden"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Slug (in de URL, bv. 'wijchen')", name: "slug", widget: "string", pattern: ["^[a-z0-9-]+$", "Alleen kleine letters, cijfers en streepjes"] }
      - { label: "Gemeentenaam (zoals getoond, bv. 'Wijchen')", name: "naam", widget: "string" }
      - label: "Paginatitel"
        name: "titel"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "string" }
          - { label: "Duits — AI-concept, controleren", name: "de", widget: "string", required: false }
          - { label: "Engels — AI-concept, controleren", name: "en", widget: "string", required: false }
      - label: "SEO-omschrijving"
        name: "seoBeschrijving"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "text" }
          - { label: "Duits — AI-concept, controleren", name: "de", widget: "text", required: false }
          - { label: "Engels — AI-concept, controleren", name: "en", widget: "text", required: false }
      - label: "Introtekst"
        name: "intro"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "markdown" }
          - { label: "Duits — AI-concept, controleren", name: "de", widget: "markdown", required: false }
          - { label: "Engels — AI-concept, controleren", name: "en", widget: "markdown", required: false }
      - label: "Afstand tot Nijmegen/de route"
        name: "afstand"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "markdown" }
          - { label: "Duits — AI-concept, controleren", name: "de", widget: "markdown", required: false }
          - { label: "Engels — AI-concept, controleren", name: "en", widget: "markdown", required: false }
      - label: "Type verblijf in dit gebied"
        name: "typeVerblijf"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "markdown" }
          - { label: "Duits — AI-concept, controleren", name: "de", widget: "markdown", required: false }
          - { label: "Engels — AI-concept, controleren", name: "en", widget: "markdown", required: false }
      - label: "Praktisch"
        name: "praktisch"
        widget: "object"
        fields:
          - { label: "Nederlands", name: "nl", widget: "markdown" }
          - { label: "Duits — AI-concept, controleren", name: "de", widget: "markdown", required: false }
          - { label: "Engels — AI-concept, controleren", name: "en", widget: "markdown", required: false }
      - label: "Vertaalstatus (automatisch bijgewerkt, niet handmatig wijzigen)"
        name: "vertaalstatus"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Duits", name: "de", widget: "select", options: ["leeg", "concept", "gecontroleerd"] }
          - { label: "Engels", name: "en", widget: "select", options: ["leeg", "concept", "gecontroleerd"] }

  - name: "site_strings"
    label: "Vaste teksten (menu, footer, homepage)"
    description: "Losse tekstblokjes die overal op de site terugkomen. Wijzig hier het Nederlands; Duits en Engels worden automatisch als concept aangevuld zodra je opslaat — controleer die voordat je erop vertrouwt dat ze live staan."
    files:
      - file: "src/data/site-strings.json"
        label: "Alle vaste teksten"
        name: "site_strings"
        format: "json"
        fields:
          - label: "Teksten"
            name: "strings"
            widget: "list"
            summary: "{{fields.key}} — {{fields.nl}}"
            fields:
              - { label: "Sleutel (niet wijzigen, koppelt aan de code)", name: "key", widget: "string", pattern: ["^[a-z0-9.]+$", "Alleen kleine letters, cijfers en punten"] }
              - { label: "Nederlands", name: "nl", widget: "text" }
              - { label: "Duits — AI-concept, controleren", name: "de", widget: "text", required: false }
              - { label: "Engels — AI-concept, controleren", name: "en", widget: "text", required: false }
              - label: "Vertaalstatus (automatisch bijgewerkt)"
                name: "vertaalstatus"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - { label: "Duits", name: "de", widget: "select", options: ["leeg", "concept", "gecontroleerd", "vastgelegd-niet-vertalen"] }
                  - { label: "Engels", name: "en", widget: "select", options: ["leeg", "concept", "gecontroleerd", "vastgelegd-niet-vertalen"] }

  - name: "pages"
    label: "Overige paginateksten"
    description: "Over ons, FAQ, gidsen en de redactionele tekst rond de listing-pagina's (camping, hotels, particulier, blarenzorg, contact). Wijzig NL; DE/EN worden automatisch als concept aangevuld."
